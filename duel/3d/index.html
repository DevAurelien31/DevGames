<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duel des Rois — prototype 3D</title>
<style>
:root{--gold:#e8b640;--glass:rgba(14,12,30,.62);--line:rgba(232,182,64,.35);--teal:#2dd4bf;--ora:#fb923c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07051a;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#ece8f6;-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.glass{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
#top{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:10px}
#top>*{pointer-events:auto}
#brand{padding:9px 16px;font-family:Georgia,"Times New Roman",serif;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--gold)}
#brand small{display:block;color:#9a93b8;letter-spacing:.08em;font-size:10px;font-family:system-ui,sans-serif;text-transform:none}
#turn{padding:9px 22px;font-family:Georgia,serif;font-size:17px;letter-spacing:.06em;color:#d7d0ee}
#turn.mine{color:#7ff0dc;text-shadow:0 0 14px rgba(45,212,191,.6)}
#opts{display:flex;gap:8px}
button{font:inherit;color:#ece8f6;cursor:pointer}
.chip{padding:8px 14px;font-size:13px;border-radius:10px;background:var(--glass);border:1px solid var(--line);transition:.15s}
.chip:hover{border-color:var(--gold)} .chip.on{background:rgba(232,182,64,.22);border-color:var(--gold);color:#ffe9a8}
#bottom{position:fixed;left:0;right:0;bottom:16px;display:flex;justify-content:center;align-items:flex-end;gap:14px;pointer-events:none}
#bottom>*{pointer-events:auto}
#mana{padding:10px 16px;display:flex;align-items:center;gap:7px}
#mana i{width:15px;height:21px;background:rgba(120,110,170,.25);clip-path:polygon(50% 0,100% 35%,80% 100%,20% 100%,0 35%);border:0}
#mana i.on{background:linear-gradient(160deg,#9bf3ff,#2a8fff 55%,#6a3cff);filter:drop-shadow(0 0 6px #3db4ff)}
#mana b{margin-left:8px;font-family:Georgia,serif;font-size:20px;color:#bfe9ff;min-width:16px}
.act{padding:13px 26px;border-radius:12px;font-family:Georgia,serif;font-size:16px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--gold);background:linear-gradient(180deg,rgba(232,182,64,.32),rgba(120,80,10,.38));box-shadow:0 0 22px rgba(232,182,64,.25),inset 0 1px 0 rgba(255,255,255,.25)}
.act:hover:not(:disabled){filter:brightness(1.25)} .act:disabled{opacity:.4;cursor:default}
.act.alt{border-color:#b78cff;background:linear-gradient(180deg,rgba(183,140,255,.32),rgba(60,30,120,.4));box-shadow:0 0 22px rgba(183,140,255,.25)}
#card{position:fixed;left:16px;bottom:16px;width:min(310px,30vw);padding:14px 16px;border-radius:14px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,.45);border-left:4px solid var(--teal)}
#card.foe{border-left-color:var(--ora)}
#card h3{margin:0 0 3px;font-family:Georgia,serif;font-size:18px;color:#fff;letter-spacing:.03em}
#card .sub{font-size:12px;color:#a9a2c8} #card em{color:#9be7ff;font-style:normal}
#card p{margin:8px 0;font-size:13.5px;line-height:1.45;color:#e2ddf2}
#banner{position:fixed;left:0;right:0;top:36%;text-align:center;font-family:Georgia,serif;font-size:clamp(34px,6vw,76px);letter-spacing:.18em;text-transform:uppercase;color:#fff;text-shadow:0 0 30px rgba(232,182,64,.8),0 4px 0 rgba(0,0,0,.4);opacity:0;transform:scale(.9);pointer-events:none;transition:opacity .35s,transform .35s}
#banner.show{opacity:1;transform:scale(1)}
#btn-replay{position:fixed;left:50%;top:55%;transform:translateX(-50%)}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,#1d1245,#07051a);font-family:Georgia,serif;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;transition:opacity .8s;z-index:9}
#loading.gone{opacity:0;pointer-events:none}
[hidden]{display:none!important}
@media (max-width:720px){#brand small{display:none}#turn{font-size:14px;padding:8px 12px}#card{bottom:84px;width:calc(100vw - 32px)}.act{padding:11px 16px;font-size:13px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="top">
  <div id="brand" class="glass">Duel des Rois<small>prototype 3D · rendu temps réel</small></div>
  <div id="turn" class="glass">…</div>
  <div id="opts"><button id="btn-auto" class="chip">Démo auto</button><button id="btn-fx" class="chip on">Effets</button></div>
</div>
<div id="card" hidden></div>
<div id="bottom">
  <div id="mana" class="glass"></div>
  <button id="btn-skill" class="act alt" hidden>Compétence</button>
  <button id="btn-token" class="act alt" hidden>Jeton +1</button>
  <button id="btn-end" class="act">Fin du tour</button>
</div>
<div id="banner"></div>
<button id="btn-replay" class="act" hidden>Rejouer</button>
<div id="loading">Chargement de l'arène…</div>
