<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Duel des Rois</title>
<style>:root{
  --bg:#0e1219;--bg1:#1d2740;--bg2:#0e1219;--surface:#171d2a;--surface2:#1e2636;--ink:#e9edf5;--muted:#93a0b8;--line:#2a3347;
  --me:#2dd4bf;--foe:#fb923c;--cellA:#46526d;--cellB:#353f56;--wall:#38bdf8;
  --mv:#4ade80;--atk:#f87171;--sk:#a78bfa;--last:#facc15;--btn:#e9edf5;--btnInk:#0e1219;
  --roi:#e0a82e;--tank:#6b93d6;--mage:#9b7be0;--support:#3fbf88;--assassin:#e0687a;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{background:radial-gradient(130% 70% at 50% -8%,var(--bg1) 0%,var(--bg2) 62%) fixed,var(--bg2)}
body{min-height:100dvh;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#app{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2{font-family:var(--serif);margin:0;letter-spacing:.01em}
h1{font-size:2.1rem}h2{font-size:1.3rem}
p{margin:0}.muted{color:var(--muted);font-size:.9rem}.small{font-size:.82rem}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--btn);color:var(--btnInk);border:0;border-radius:12px;padding:12px 16px;font-weight:650;min-height:46px;box-shadow:0 2px 10px rgba(0,0,0,.25);transition:transform .12s,filter .12s}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1}.between{justify-content:space-between}
.card{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.seg{display:grid;gap:8px}
.opt{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;min-height:44px}
.opt.on{border-color:var(--me);box-shadow:0 0 0 2px color-mix(in srgb,var(--me) 25%,transparent)}
.opt b{display:block}.opt span{color:var(--muted);font-size:.85rem}
.hero{text-align:center;padding:18px 0 4px}.hero p{margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ucard{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px}
.ucard.on{border-color:var(--me);box-shadow:0 0 0 2px color-mix(in srgb,var(--me) 25%,transparent)}
.ucard.gone{opacity:.35}.ucard .nm{font-size:.74rem;line-height:1.15}
.tag{font-size:.68rem;color:var(--muted)}
.tok{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.9rem;position:relative;border:3px solid var(--line);flex:none}
.tok.Roi{background:var(--roi)}.tok.Tank{background:var(--tank)}.tok.Mage{background:var(--mage)}.tok.Support{background:var(--support)}.tok.Assassin{background:var(--assassin)}
.tok.own{border-color:var(--me)}.tok.foe{border-color:var(--foe)}
.crown{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:.8rem;color:var(--roi);text-shadow:0 0 2px var(--surface),0 0 2px var(--surface)}
.steps{display:flex;gap:3px;flex-wrap:wrap}
.dot{width:20px;height:6px;border-radius:3px;background:var(--line)}.dot.me{background:var(--me)}.dot.foe{background:var(--foe)}.dot.cur{outline:2px solid var(--ink);outline-offset:1px}.dot.done{opacity:.35}
.team{display:flex;gap:4px;align-items:center;min-height:40px;flex-wrap:wrap}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:.9rem}
.bar .who{font-weight:700}.bar.me .who{color:var(--me)}.bar.foe .who{color:var(--foe)}
.hearts{color:var(--atk);letter-spacing:2px}.mana{font-variant-numeric:tabular-nums}
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));width:100%;aspect-ratio:6/8;border-radius:12px;overflow:hidden;border:1px solid var(--line);user-select:none}
.cell{min-height:0;position:relative;display:grid;place-items:center;border:0;padding:0;background:var(--cellA);min-width:0}
.cell.alt{background:var(--cellB)}
.cell.homeFoe::after,.cell.homeMe::after{content:"";position:absolute;left:0;right:0;height:3px}
.cell.mv::before{content:"";width:28%;aspect-ratio:1;border-radius:50%;background:var(--mv);opacity:.85}
.cell.atk,.cell.skc,.cell.last,.cell.pick{box-shadow:inset 0 0 0 3px var(--c)}
.cell.atk{--c:var(--atk)}.cell.skc{--c:var(--sk)}.cell.last{--c:var(--last)}.cell.pick{--c:var(--ink)}
.cell.skc.mv::before{background:var(--sk)}
.cell.wallc,.cell.wallc.alt{background:color-mix(in srgb,var(--wall) 55%,var(--cellA))}
.cell .wl{font-size:1.3rem}.cell .trap{position:absolute;bottom:2px;right:3px;font-size:.8rem;color:var(--atk)}
.cell .tok{width:76%;height:auto;aspect-ratio:1;font-size:clamp(.7rem,3.6vw,1rem)}
.cell .tok.sel{box-shadow:0 0 0 3px var(--ink)}
.bdg{position:absolute;top:-4px;right:-4px;font-size:.7rem;line-height:1}
.hp{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font-size:.65rem;color:var(--atk);white-space:nowrap;text-shadow:0 0 2px var(--surface),0 0 2px var(--surface)}
.info b{font-family:var(--serif);font-size:1.05rem}
.ticker{min-height:1.3em;color:var(--muted);font-size:.85rem}
.overlay{position:fixed;inset:0;background:rgba(10,12,16,.6);display:grid;place-items:center;padding:16px;z-index:5}
.overlay .card{max-width:420px;width:100%;max-height:85dvh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.rules p{margin:0 0 6px;font-size:.9rem}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.slot{aspect-ratio:1;border:2px dashed var(--line);border-radius:10px;background:var(--surface);display:grid;place-items:center;padding:0}
.slot .tok{width:80%;height:auto;aspect-ratio:1;font-size:.85rem}
.slot.q{font-size:1.4rem;color:var(--muted)}
.colno{text-align:center;font-size:.7rem;color:var(--muted)}
.think{display:inline-block;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.think{animation:none}}
[data-k],.ucard{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.ucardbig .row{gap:12px}.ucardbig .tok{width:56px;height:56px;font-size:1.1rem}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:6px}.facts div{background:var(--bg);border-radius:8px;padding:6px 8px}
.facts span{display:block;font-size:.7rem;color:var(--muted)}.facts b{font-size:.9rem}
.overlay.solid{background:var(--bg)}
.opt.mode{display:block;width:100%}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pgrid.pyr{grid-template-columns:repeat(10,1fr);gap:4px}
.pn{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pn span{font-size:.6rem;color:var(--muted);letter-spacing:-1px}
.pn.done{background:color-mix(in srgb,var(--me) 22%,var(--surface));border-color:var(--me)}
.pn.cur{box-shadow:0 0 0 2px var(--ink)}.pn.boss{border-color:var(--atk)}
.pn:disabled{opacity:.35}
.pgrid.pyr .pn{min-height:34px;padding:2px;border-radius:7px;font-size:.72rem}
.lesson b{font-family:var(--serif)}.hint{color:var(--sk)}.sol{margin:6px 0 0;padding-left:18px}
.newach{background:var(--bg);border-radius:8px;padding:8px;font-size:.85rem}
.opt .row{align-items:center}
.rb{position:relative;aspect-ratio:6/8;max-width:300px;width:100%;margin:6px auto;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rbg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(8,1fr)}
.mc{background:var(--cellA)}.mc.alt{background:var(--cellB)}
.rt{position:absolute;width:16.6667%;height:12.5%;display:grid;place-items:center;transition:left .45s ease,top .45s ease;z-index:3}
.rt .tok{width:78%;height:auto;aspect-ratio:1;font-size:clamp(.6rem,2.8vw,.85rem);border-width:2px}
.rt .hp{font-size:.55rem;bottom:-6px}.rt .bdg{font-size:.6rem}
.rfx{position:absolute;inset:0;pointer-events:none;z-index:4}
.rs,.rf{position:absolute;width:16.6667%;height:12.5%;display:grid;place-items:center}
.rs.wall{background:color-mix(in srgb,var(--wall) 55%,transparent);z-index:1}.rs.trap{color:var(--atk);font-size:.9rem}
.rf{border-radius:6px;animation:rf .9s ease-out forwards}
.rf.src{box-shadow:inset 0 0 0 3px var(--last)}.rf.atk{background:color-mix(in srgb,var(--atk) 55%,transparent);box-shadow:inset 0 0 0 3px var(--atk)}.rf.sk{background:color-mix(in srgb,var(--sk) 50%,transparent);box-shadow:inset 0 0 0 3px var(--sk)}
@keyframes rf{0%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.rt{transition:none}.rf{animation-duration:.01s}}
.cap{min-height:2.4em;color:var(--muted);text-align:center}
.why{background:var(--bg);border-radius:10px;padding:10px;margin-top:10px}
.topbar{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 10px;text-align:left}
.topbar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .elo{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--me);color:#fff;font-weight:700;flex:none}
.av.big{width:48px;height:48px;font-size:1.3rem}
.inp{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px;min-height:44px}
.pos{color:var(--mv)}.neg{color:var(--atk)}
.eloline{font-size:.9rem;font-variant-numeric:tabular-nums}
.recapbox{display:flex;flex-direction:column;gap:8px}
.recap{width:100%;border-collapse:collapse;font-size:.78rem;font-variant-numeric:tabular-nums}
.recap th{font-weight:600;color:var(--muted);text-align:center;padding:4px 2px;font-size:.68rem;border-bottom:1px solid var(--line)}
.recap th:first-child,.recap td:first-child{text-align:left}
.recap td{text-align:center;padding:5px 2px;border-bottom:1px solid var(--line)}
.recap .cd{display:inline-block;min-width:22px;padding:1px 3px;border-radius:6px;background:var(--bg);font-weight:700;font-size:.7rem;text-align:center}
.opt.rk{display:block;width:100%}.opt.rk .elo{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pladder{display:flex;flex-direction:column;gap:4px}
.prow{display:grid;grid-template-columns:86px repeat(5,1fr);gap:4px;align-items:center}
.prow .pr{font-size:.78rem;font-weight:600;color:var(--muted)}
.prow .pn{min-height:34px;padding:2px;border-radius:8px;font-size:.8rem}

/* ===== Jetons : médaillon métallique + icône ===== */
.tok{border:0;background:none;box-shadow:0 2px 4px rgba(0,0,0,.45);--c1:#6b7280;--c2:#374151;--rim:#9ca3af}
.tok::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 28%,var(--c1),var(--c2) 78%);box-shadow:inset 0 0 0 2px var(--rim),inset 0 0 0 3.5px rgba(0,0,0,.35),inset 0 2px 5px rgba(255,255,255,.25)}
.tok.Roi{--c1:#f2c94c;--c2:#8a5a00}.tok.Tank{--c1:#7aa2e0;--c2:#1f3a66}.tok.Mage{--c1:#b693f0;--c2:#40227a}.tok.Support{--c1:#5ed39a;--c2:#145a37}.tok.Assassin{--c1:#f07a8a;--c2:#6e1426}
.tok.own{--rim:#2dd4bf}.tok.foe{--rim:#fb923c}
.tok.own::after,.tok.foe::after{content:"";position:absolute;left:50%;bottom:-3px;width:46%;height:4px;border-radius:2px;transform:translateX(-50%);background:var(--rim);box-shadow:0 0 6px var(--rim)}
.tok .ic{position:relative;width:62%;height:62%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.55))}
.tok.Roi .ic{stroke-width:2.1}
.tok.sel::before{box-shadow:inset 0 0 0 2px var(--rim),0 0 0 3px #fff,0 0 12px 3px var(--rim)}
.tok.sel{box-shadow:none;animation:selp 1.2s ease-in-out infinite}
@keyframes selp{50%{transform:translateY(-2px)}}
.crown{z-index:2;font-size:.95rem;top:-11px;color:#ffd84d;text-shadow:0 1px 2px #000,0 0 5px #b45309}
.tok .bdg,.tok .hp{z-index:2}
/* ===== Plateau : échiquier de pierre, cadre doré, camps éclairés ===== */
.board{border:0;border-radius:10px;padding:0;background:#2b2418;box-shadow:0 0 0 3px #c9a24a,0 0 0 5px #4a3714,0 8px 22px rgba(0,0,0,.45)}
.cell{background:linear-gradient(145deg,color-mix(in srgb,var(--cellA) 92%,#fff),var(--cellA))}
.cell.alt{background:linear-gradient(145deg,color-mix(in srgb,var(--cellB) 92%,#fff),var(--cellB))}
.cell.homeMe{box-shadow:inset 0 -4px 10px -4px #2dd4bf,inset 0 0 0 1px rgba(45,212,191,.35)}
.cell.homeFoe{box-shadow:inset 0 4px 10px -4px #fb923c,inset 0 0 0 1px rgba(251,146,60,.35)}
.cell.homeMe::after,.cell.homeFoe::after{display:none}
.cell.mv::before{width:30%;background:radial-gradient(circle,#86efac,var(--mv));box-shadow:0 0 8px 2px var(--mv);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.8);opacity:.7}}
.cell.atk{background:radial-gradient(circle,rgba(248,113,113,.55),rgba(220,38,38,.25))}
.cell.skc{background:radial-gradient(circle,rgba(167,139,250,.55),rgba(124,58,237,.25))}
.cell.atk,.cell.skc,.cell.last,.cell.pick{box-shadow:inset 0 0 0 2px var(--c),inset 0 0 12px var(--c)}
.cell.wallc,.cell.wallc.alt{background:linear-gradient(145deg,#0b3a5a,#0e4d75)}
.cell .wl{display:grid;place-items:center;width:84%;height:84%;animation:wallin .35s ease-out}
.wsv{width:100%;height:100%;filter:drop-shadow(0 0 5px #38bdf8)}
@keyframes wallin{from{transform:scale(.3);opacity:0}}
.cell .trap{bottom:3px;right:3px;width:34%;height:34%;font-size:0}
.tsv{width:100%;height:100%;filter:drop-shadow(0 0 3px #000)}
.cell .co{position:absolute;font-style:normal;font-size:.55rem;font-weight:700;color:color-mix(in srgb,var(--ink) 55%,transparent);pointer-events:none;line-height:1}
.cell .co.rk{top:2px;left:3px}.cell .co.fl{bottom:2px;right:3px}
.rb{border:0;border-radius:8px;box-shadow:0 0 0 2px #c9a24a,0 0 0 3px #4a3714}
.mc{background:linear-gradient(145deg,color-mix(in srgb,var(--cellA) 92%,#fff),var(--cellA))}.mc.alt{background:linear-gradient(145deg,color-mix(in srgb,var(--cellB) 92%,#fff),var(--cellB))}
/* ===== Cristaux de mana ===== */
.mana{display:flex;align-items:center;gap:6px}
.gems{display:inline-flex;gap:1px;flex-wrap:wrap;max-width:190px}
.gem{display:inline-block;width:15px;height:18px;transition:transform .25s,filter .25s}
.gem svg{width:100%;height:100%;display:block}
.gem .gb{stroke:#0c4a6e;stroke-width:1}.gem .gl{fill:none;stroke:#fff;stroke-opacity:.5;stroke-width:.8}
.gem.full .gb{fill:url(#none);fill:#38bdf8}
.gem.full{filter:drop-shadow(0 0 4px #38bdf8)}
.gem.empty .gb{fill:transparent;stroke:var(--muted);stroke-opacity:.6;stroke-dasharray:2 1.5}.gem.empty .gl{stroke:var(--muted);stroke-opacity:.25}
.gem.extra .gb{fill:#fbbf24;stroke:#92400e}.gem.extra{filter:drop-shadow(0 0 5px #fbbf24)}
.mana .mn{font-size:.8rem;color:var(--muted);font-weight:600}.mana .jt{font-size:.68rem;padding:1px 6px;border-radius:8px;background:#fbbf24;color:#422006;font-weight:700}
/* ===== Animations ===== */
.board{position:relative}
.fxl{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.fx{position:absolute;transform:translate(-50%,-50%);pointer-events:none;animation-fill-mode:forwards;animation-timing-function:ease-out}
.fx.ring{border-radius:50%;border:3px solid var(--c);animation-name:fxring}
.fx.burst{border-radius:50%;background:radial-gradient(circle,#fff 0,var(--c) 38%,transparent 70%);animation-name:fxburst}
.fx.slash{background:linear-gradient(135deg,transparent 44%,#fff 48%,#fff 52%,transparent 56%);animation-name:fxburst}
.fx.orb{border-radius:50%;background:radial-gradient(circle,#fff,var(--c));box-shadow:0 0 10px 3px var(--c)}
.fx.trail{border-radius:50%;background:var(--c);filter:blur(3px);animation-name:fxfade}
.fx.crack{background:conic-gradient(from 20deg,transparent 0 8%,var(--c) 8% 10%,transparent 10% 30%,var(--c) 30% 32%,transparent 32% 55%,var(--c) 55% 57%,transparent 57% 80%,var(--c) 80% 82%,transparent 82%);border-radius:50%;animation-name:fxfade}
.fx.spark{background:radial-gradient(circle,#fff 0,var(--c) 30%,transparent 65%);animation-name:fxspark;border-radius:50%}
.fx.spark::before,.fx.spark::after{content:"✦";position:absolute;color:var(--c);font-size:14px;text-shadow:0 0 6px var(--c)}
.fx.spark::before{left:8%;top:6%}.fx.spark::after{right:6%;bottom:10%}
.fx.shield{border-radius:50%;border:3px solid var(--c);background:radial-gradient(circle,transparent 55%,color-mix(in srgb,var(--c) 45%,transparent));box-shadow:0 0 14px var(--c);animation-name:fxshield}
.fx.frost{border-radius:50%;background:radial-gradient(circle,rgba(224,247,255,.9),rgba(56,189,248,.55) 55%,transparent 72%);animation-name:fxspark}
.fx.smoke{border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 70%,transparent),transparent 70%);filter:blur(2px);animation-name:fxspark}
.fx.shatter{background:conic-gradient(from 0deg,var(--c) 0 12%,transparent 12% 25%,var(--c) 25% 37%,transparent 37% 50%,var(--c) 50% 62%,transparent 62% 75%,var(--c) 75% 87%,transparent 87%);border-radius:50%;animation-name:fxring}
.fx.pop,.fx.dmg{display:grid;place-items:center;font-weight:900;color:var(--c);text-shadow:0 0 3px #000,0 1px 0 #000;font-size:1.3rem;animation-name:fxpop}
.fx.dmg{font-size:1.5rem;animation-name:fxdmg}
.fx.bolt{left:0;top:0;transform:none;overflow:visible;animation:fxfade .5s forwards}
.fx.bolt path{fill:none;stroke-width:3;stroke-linejoin:round;filter:drop-shadow(0 0 5px #facc15)}
@keyframes fxring{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
@keyframes fxburst{from{transform:translate(-50%,-50%) scale(.2);opacity:1}60%{opacity:1}to{transform:translate(-50%,-50%) scale(1.2);opacity:0}}
@keyframes fxfade{from{opacity:.9}to{opacity:0}}
@keyframes fxspark{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}30%{opacity:1}100%{transform:translate(-50%,-62%) scale(1.15);opacity:0}}
@keyframes fxshield{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}30%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-50%,-50%) scale(1.15);opacity:0}}
@keyframes fxpop{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}25%{transform:translate(-50%,-90%) scale(1.3);opacity:1}100%{transform:translate(-50%,-140%) scale(1);opacity:0}}
@keyframes fxdmg{0%{transform:translate(-50%,-30%) scale(.4);opacity:0}20%{transform:translate(-50%,-80%) scale(1.4);opacity:1}100%{transform:translate(-50%,-170%) scale(1);opacity:0}}
/* ===== États persistants sur les pions ===== */
.cell .wl{animation:none}
.tok .stl{position:absolute;inset:0;border-radius:50%;z-index:1;pointer-events:none}
.tok.st-immo .stl{background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.85),rgba(125,211,252,.55) 45%,rgba(14,165,233,.55));box-shadow:inset 0 0 0 2px #e0f2fe,0 0 8px #38bdf8}
.tok.st-immo .ic{opacity:.55}
.tok.st-immo .stl::after{content:"❄";position:absolute;inset:0;display:grid;place-items:center;font-size:1.05em;color:#fff;text-shadow:0 0 4px #0369a1}
.tok.st-imm::before{box-shadow:inset 0 0 0 2px var(--rim),0 0 0 2px #fbbf24,0 0 10px #fbbf24}
.tok.st-shield::before{box-shadow:inset 0 0 0 2px var(--rim),0 0 0 2px #93c5fd,0 0 10px 1px #60a5fa}
.tok.st-taunt::before{box-shadow:inset 0 0 0 2px var(--rim),0 0 0 2px #ef4444,0 0 10px #ef4444;animation:tpulse 1s infinite}
@keyframes tpulse{50%{filter:brightness(1.4)}}
.tok.st-ghost{opacity:.55;filter:saturate(.7)}
.tok.st-cd .stl{background:conic-gradient(rgba(0,0,0,.62) 0 50%,transparent 50%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.tok.st-once .stl{background:rgba(0,0,0,.55)}
.tok.st-once .stl::after{content:"1×";position:absolute;inset:0;display:grid;place-items:center;font-size:.7em;font-weight:800;color:#fff}
.tok.st-cd .stl::after{content:"⏳";position:absolute;right:-5px;top:-5px;font-size:.62em;line-height:1}
@media (prefers-reduced-motion:reduce){.cell.mv::before,.tok.sel,.tok.st-taunt::before{animation:none}}
/* ===== Accueil ===== */
.hero2{text-align:center;padding:10px 0 0}.hero2 h1{margin-top:2px;background:linear-gradient(180deg,#ffe083,#b7791f);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
.logo{width:64px;height:56px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.prof{background:linear-gradient(135deg,color-mix(in srgb,var(--rc) 22%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--rc) 55%,var(--line));border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.prog{height:8px;border-radius:6px;background:color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--rc),#fff);border-radius:6px;transition:width .6s}
.rbadge{flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.playbig{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:16px;padding:16px;color:#fff;text-align:left;background:linear-gradient(135deg,#0f766e,#0d9488 55%,#14b8a6);box-shadow:0 6px 16px rgba(13,148,136,.4),inset 0 1px 0 rgba(255,255,255,.3);position:relative;overflow:hidden}
.playbig::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.25) 50%,transparent 65%);transform:translateX(-120%);animation:shine 3.5s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(120%)}}
.playbig .mi{width:40px;height:40px;flex:none}.playbig b{font-size:1.35rem;display:block;font-family:var(--serif)}.playbig small{opacity:.9;font-size:.8rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px;border-radius:14px;border:1px solid color-mix(in srgb,var(--tc) 40%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 16%,var(--surface)),var(--surface));min-height:104px;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile b{font-size:.98rem;margin-top:6px}.tile>span:last-child{font-size:.76rem;color:var(--muted)}
.tic{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,color-mix(in srgb,var(--tc) 70%,#fff),var(--tc));box-shadow:0 2px 6px color-mix(in srgb,var(--tc) 50%,transparent)}
.mi{width:22px;height:22px}.btn .mi{width:16px;height:16px;vertical-align:-3px}
.nb{position:absolute;top:10px;right:10px;width:11px;height:11px;border-radius:50%;background:#ef4444;box-shadow:0 0 0 3px color-mix(in srgb,#ef4444 30%,transparent);animation:pulse 1.4s infinite}
.topbar .rbadge{margin-left:auto}.topbar b{flex:0 1 auto}.topbar .elo{margin-left:0}
/* ===== Draft pick & ban ===== */
.dhead{border-radius:14px;padding:10px 14px;color:#fff;text-align:center;background:linear-gradient(135deg,#1e3a8a,#2563eb);box-shadow:0 4px 12px rgba(37,99,235,.35)}
.dhead.ban{background:linear-gradient(135deg,#7f1d1d,#dc2626);box-shadow:0 4px 12px rgba(220,38,38,.35)}
.dhead.done{background:linear-gradient(135deg,#14532d,#16a34a)}
.dph{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;opacity:.85;font-weight:700}
.dturn{font-family:var(--serif);font-size:1.15rem;margin-top:2px}.dturn.mine{animation:pulse 1.6s ease-in-out infinite}
.dsteps{display:flex;gap:3px;justify-content:space-between}
.ds{flex:1;aspect-ratio:1;max-width:30px;border-radius:50%;display:grid;place-items:center;font-size:.6rem;color:var(--muted);border:2px solid var(--line);background:var(--surface);position:relative}
.ds.own{border-color:var(--me)}.ds.foe{border-color:var(--foe)}
.ds.ban{border-radius:7px}.ds.done{opacity:.55}.ds.cur{opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 25%,transparent);animation:pulse 1.2s infinite}
.ds .ic{width:70%;height:70%;stroke:var(--ink)}
.tm{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px;border-left:4px solid var(--me)}.tm.foe{border-left-color:var(--foe)}
.tmh{font-size:.74rem;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
.tms{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:center;justify-items:center}
.tms .tok{width:100%;max-width:52px;height:auto;aspect-ratio:1}
.ps{width:100%;max-width:52px;aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-style:normal}
.ps.full{border:0}.ps.full .tok{width:100%}.ps i{font-style:normal;font-size:1.1rem}
.ps.cur,.bs.cur{border-color:var(--ink);animation:pulse 1.2s infinite}
.ps.new .tok,.bs.new .tok{animation:land .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes land{from{transform:scale(2.2) translateY(-20px);opacity:0}}
.bans{display:flex;align-items:center;gap:6px}
.bs{width:36px;height:36px;border-radius:9px;border:2px dashed var(--line);display:grid;place-items:center;position:relative;background:var(--surface)}
.bs .q{font-style:normal;color:var(--muted);opacity:.5}.bs.full{border-style:solid;border-color:#dc2626}
.bs .tok{width:78%;height:auto;aspect-ratio:1;filter:grayscale(.85) brightness(.8)}
.bs .x{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:1.4rem;color:#ef4444;text-shadow:0 0 3px #000}
.bs.new .x{animation:slam .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes slam{from{transform:scale(3);opacity:0}}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;font-size:.82rem;white-space:nowrap}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pgrid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pc{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 6px;border-radius:12px;border:2px solid var(--line);background:var(--surface);min-height:84px;transition:transform .12s,border-color .12s}
.pc:active{transform:scale(.96)}
.pc .tok{width:78%;height:auto;aspect-ratio:1}.pc .nm{font-size:.68rem;line-height:1.1;text-align:center}
.pc.Tank{border-top:4px solid var(--tank)}.pc.Mage{border-top:4px solid var(--mage)}.pc.Support{border-top:4px solid var(--support)}.pc.Assassin{border-top:4px solid var(--assassin)}.pc.Roi{border-top:4px solid var(--roi)}
.pc.on{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 20%,transparent);transform:translateY(-2px)}
.pc.banned{opacity:.4}.pc.banned .tok{filter:grayscale(1)}.pc.taken{opacity:.55}
.pc .bx{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:2.4rem;font-weight:900;color:#ef4444;text-shadow:0 0 4px #000;pointer-events:none}
.pc .tk{position:absolute;top:2px;right:5px;font-style:normal;font-weight:900;color:var(--me)}.pc.taken.foe .tk{color:var(--foe)}
.finfo{min-height:64px}
.dbar{position:sticky;bottom:0;padding:10px 0 4px;background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:3}
.btn.big{width:100%;min-height:52px;font-size:1.05rem}
.btn.ban{background:#dc2626;color:#fff}
.tms{padding-top:10px}

/* ===== Plateau Canvas ===== */
.boardwrap{position:relative;width:100%;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.4)}
.bv{display:block;width:100%;height:auto;aspect-ratio:6/8;border-radius:14px;touch-action:manipulation;-webkit-user-select:none;user-select:none;cursor:pointer}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.skin{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;border:2px solid var(--line);background:var(--surface)}
.skin.on{border-color:var(--ink)}.skin b{font-size:.85rem}
.skin .sw{position:relative;width:54px;height:54px;border-radius:10px;display:block}
.skin .sw i{position:absolute;width:18px;height:18px;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.skin .sw i:first-child{left:7px;bottom:7px}.skin .sw i:last-child{right:7px;top:7px}
